[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy AI API calls to Netlify Functions
[[redirects]]
  from = "/api/ai/generate-dish"
  to = "/.netlify/functions/generate-dish"
  status = 200

[[redirects]]
  from = "/api/ai/suggest-menu"
  to = "/.netlify/functions/suggest-menu"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
